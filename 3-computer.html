<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS GEAR | 紅黑戰境電競裝備庫</title>
  <style>
    /* --- CSS 變數與紅黑配色設定 --- */
    :root {
      --bg-color: #080305;
      --card-bg: #12070a;
      --card-bg-hover: #1f0b11;
      --accent-red: #ff1e42;
      --accent-crimson: #99001c;
      --accent-cyan: #00f3ff;
      --text-main: #f0e6e8;
      --text-muted: #a08890;
      --border-color: #2e0f17;
      --glow-red: rgba(255, 30, 66, 0.4);
      --glow-crimson: rgba(153, 0, 28, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* --- RGB 漸層動態背景 --- */
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(255, 30, 66, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(153, 0, 28, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 60%);
      background-size: 200% 200%;
      animation: rgbGradientMove 12s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @keyframes rgbGradientMove {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    /* --- 導覽列 --- */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 3, 5, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ff1e42, #ff6b81, #ff1e42);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-shadow: 0 0 15px var(--glow-red);
    }

    .tagline {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
    }

    .cart-btn {
      position: relative;
      background: rgba(255, 30, 66, 0.1);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart-btn:hover {
      background: var(--accent-red);
      color: #fff;
      box-shadow: 0 0 20px var(--glow-red);
    }

    .cart-count {
      background: #fff;
      color: var(--accent-crimson);
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
    }

    /* --- 視圖切換 --- */
    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    /* --- 英雄區塊與 Tab --- */
    .hero {
      text-align: center;
      padding: 2.5rem 1.5rem 1.5rem;
      max-width: 850px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 2.3rem;
      margin-bottom: 0.8rem;
      color: #fff;
      text-shadow: 0 0 15px var(--glow-red);
      letter-spacing: 1px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 1.8rem 0 2rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.6rem 1.5rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .tab-btn:hover, .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-crimson), var(--accent-red));
      border-color: var(--accent-red);
      color: #fff;
      box-shadow: 0 0 15px var(--glow-red);
    }

    /* --- 商品網格 --- */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
      flex: 1;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.8rem;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-red);
      box-shadow: 0 5px 25px rgba(255, 30, 66, 0.25);
    }

    .image-wrapper {
      width: 100%;
      height: 180px;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
      transition: opacity 0.3s ease, transform 0.5s ease;
    }

    .product-card:hover .product-img {
      opacity: 1;
      transform: scale(1.06);
    }

    .product-info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-category-tag {
      font-size: 0.7rem;
      color: var(--accent-red);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.3rem;
      font-weight: bold;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-red);
      margin-bottom: 1rem;
    }

    .card-buttons {
      margin-top: auto;
      display: flex;
      gap: 0.5rem;
    }

    .btn-secondary {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn-primary {
      flex: 1.5;
      background: linear-gradient(90deg, #2b0008, var(--accent-crimson));
      border: 1px solid var(--accent-red);
      color: var(--text-main);
      padding: 0.6rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(90deg, var(--accent-crimson), var(--accent-red));
      color: #fff;
      box-shadow: 0 0 15px var(--glow-red);
    }

    /* --- Modal 彈出視窗 --- */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-body {
      background: var(--card-bg);
      border: 1px solid var(--accent-red);
      border-radius: 8px;
      width: 90%;
      max-width: 650px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 0 35px var(--glow-red);
      padding: 1.8rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover { color: var(--accent-red); }

    /* --- 商品詳情 Modal --- */
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1rem;
    }

    .detail-img {
      width: 100%;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    .detail-info h2 {
      color: #fff;
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }

    .detail-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .detail-specs {
      background: rgba(0, 0, 0, 0.4);
      padding: 0.8rem;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      border-left: 3px solid var(--accent-red);
    }

    .option-group {
      margin-bottom: 1rem;
    }

    .option-title {
      font-size: 0.85rem;
      color: #fff;
      margin-bottom: 0.4rem;
      display: block;
    }

    .option-select {
      width: 100%;
      background: #080305;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.5rem;
      border-radius: 4px;
      outline: none;
    }

    .option-select:focus {
      border-color: var(--accent-red);
    }

    /* --- 購物車 Modal --- */
    .cart-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.8rem;
      margin-bottom: 1rem;
    }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-height: 300px;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.8rem;
      border-radius: 4px;
      border-left: 3px solid var(--accent-red);
    }

    .cart-item-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .cart-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 1rem;
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* --- 結帳頁面 --- */
    .checkout-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .checkout-title {
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 2rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .form-control {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 0.7rem;
      border-radius: 4px;
      color: #fff;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-red);
    }

    .order-summary {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      border-radius: 6px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.8rem;
      font-size: 0.9rem;
    }

    .summary-total {
      border-top: 1px solid var(--border-color);
      padding-top: 0.8rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-red);
    }

    /* --- 頁尾 --- */
    footer {
      border-top: 1px solid var(--border-color);
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 3rem;
    }

    /* --- 響應式調整 --- */
    @media (max-width: 768px) {
      .detail-grid, .checkout-grid {
        grid-template-columns: 1fr;
      }
      header {
        padding: 0.8rem 1rem;
      }
      .logo {
        font-size: 1.4rem;
      }
      .hero h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <!-- 導覽列 -->
  <header>
    <div class="header-container">
      <div class="brand" onclick="switchView('shop')">
        <span class="logo">NEXUS GEAR</span>

      </div>
      <button class="cart-btn" onclick="toggleCartModal()">
        🛒 購物車 <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </header>

        <button class="tab-btn" onclick="filterCategory('gear', this)">裝備配件 (10)</button>

    </section>

    <!-- 商品網格區塊 -->
    <main class="container">
      <div class="product-grid" id="product-grid">
        <!-- 商品卡片由 JS 動態生成 -->
      </div>
    </main>
  </div>

  <!-- 視圖 2：結帳頁面 -->
  <div id="checkout-view" class="view-section">
    <div class="checkout-container">
      <h2 class="checkout-title">結帳確認 (Checkout)</h2>
      <div class="checkout-grid">
        <!-- 訂購人與配送資訊表單 -->
        <div>
          <h3 style="color:#fff; margin-bottom:1rem;">1. 訂購人資訊與寄送地址</h3>
          <form id="checkout-form" onsubmit="handleCheckoutSubmit(event)">
            <div class="form-group">
              <label>姓名</label>
              <input type="text" class="form-control" required placeholder="請輸入收件人姓名" />
            </div>
            <div class="form-group">
              <label>電子郵件</label>
              <input type="email" class="form-control" required placeholder="example@nexus.com" />
            </div>
            <div class="form-group">
              <label>行動電話</label>
              <input type="tel" class="form-control" required placeholder="0912-345-678" />
            </div>
            <div class="form-group">
              <label>收件地址</label>
              <input type="text" class="form-control" required placeholder="請輸入完整運送地址" />
            </div>
            <h3 style="color:#fff; margin:1.5rem 0 1rem;">2. 付款方式 (模擬)</h3>
            <div class="form-group">
              <select class="form-control">
                <option>信用卡 / 金融卡 (VISA / MasterCard)</option>
                <option>超商貨到付款</option>
                <option>LINE Pay / 街口支付</option>
              </select>
            </div>
            <button type="submit" class="btn-primary" style="width:100%; padding:0.8rem; margin-top:1rem; font-size:1rem;">
              確認下單 (完成測試)
            </button>
          </form>
        </div>

        <!-- 訂單明細 -->
        <div>
          <div class="order-summary">
            <h3 style="color:#fff; margin-bottom:1rem;">訂單摘要</h3>
            <div id="checkout-items-list">
              <!-- 結帳清單動態生成 -->
            </div>
            <div class="summary-row" style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 0.8rem;">
              <span>小計</span>
              <span id="checkout-subtotal">NT$ 0</span>
            </div>
            <div class="summary-row">
              <span>運費</span>
              <span style="color:var(--accent-red);">免運費</span>
            </div>
            <div class="summary-row summary-total">
              <span>總計</span>
              <span id="checkout-final-total">NT$ 0</span>
            </div>
            <button class="btn-secondary" onclick="switchView('shop')" style="width:100%; margin-top:1rem;">
              ← 返回繼續購物
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 商品詳情 Modal -->
  <div class="modal" id="detail-modal">
    <div class="modal-body">
      <button class="close-btn" onclick="closeModal('detail-modal')">&times;</button>
      <div id="detail-content">
        <!-- 動態渲染商品詳情 -->
      </div>
    </div>
  </div>

  <!-- 購物車 Modal -->
  <div class="modal" id="cart-modal">
    <div class="modal-body" style="max-width:480px;">
      <button class="close-btn" onclick="closeModal('cart-modal')">&times;</button>
      <div class="cart-header">
        <h2 style="color:var(--accent-red); font-size:1.3rem;">已選購裝備</h2>
      </div>
      <div class="cart-items" id="cart-items">
        <!-- 購物車列表動態渲染 -->
      </div>
      <div class="cart-footer">
        <div>
          <span>總計：</span>
          <strong id="cart-total" style="color: var(--accent-red); font-size: 1.2rem;">NT$ 0</strong>
        </div>
        <button class="btn-primary" onclick="goToCheckout()">前往結帳</button>
      </div>
    </div>
  </div>

  <!-- 頁尾 -->
  <footer>
    &copy; 2026 NEXUS GEAR. All rights reserved. 專為電競玩家設計。
  </footer>

    let cart = [];
    let currentCategory = 'all';

    // --- 渲染商品卡片列表 ---
    function renderProducts() {
      const grid = document.getElementById("product-grid");
      const filtered = currentCategory === 'all' 
        ? products 
        : products.filter(p => p.category === currentCategory);

      grid.innerHTML = filtered.map(product => `
        <div class="product-card" onclick="openDetailModal(${product.id})">
          <div class="image-wrapper">
            <img class="product-img" src="${product.image}" alt="${product.name}" loading="lazy" />
          </div>
          <div class="product-info">
            <span class="product-category-tag">${getCategoryName(product.category)}</span>
            <h3 class="product-title">${product.name}</h3>
            <div class="product-price">NT$ ${product.price.toLocaleString()}</div>
            <div class="card-buttons">
              <button class="btn-secondary" onclick="event.stopPropagation(); openDetailModal(${product.id})">詳情</button>
              <button class="btn-primary" onclick="event.stopPropagation(); quickAddToCart(${product.id})">加入購物車</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    function getCategoryName(catKey) {
      const map = { peripherals: '核心外設', audio: '音訊影音', gear: '裝備配件' };
      return map[catKey] || '電競裝備';
    }

    // --- 分類篩選 ---
    function filterCategory(category, element) {
      currentCategory = category;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      renderProducts();
    }

    // --- 打開商品詳情 Modal ---
    function openDetailModal(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const detailContent = document.getElementById("detail-content");
      detailContent.innerHTML = `
        <div class="detail-grid">
          <img class="detail-img" src="${product.image}" alt="${product.name}" />
          <div class="detail-info">
            <span class="product-category-tag">${getCategoryName(product.category)}</span>
            <h2>${product.name}</h2>
            <div class="product-price">NT$ ${product.price.toLocaleString()}</div>
            <p class="detail-desc">${product.desc}</p>
            <div class="detail-specs">
              <strong>規格尺寸：</strong> ${product.size}
            </div>
            <div class="option-group">
              <label class="option-title">選擇顏色/款式 (${product.colors.length} 種選擇)：</label>
              <select class="option-select" id="modal-color-select">
                ${product.colors.map(color => `<option value="${color}">${color}</option>`).join("")}
              </select>
            </div>
            <button class="btn-primary" style="width:100%; padding:0.8rem;" onclick="addDetailToCart(${product.id})">
              加入購物車
            </button>
          </div>
        </div>
      `;
      openModal("detail-modal");
    }

    // --- 購物車邏輯 ---
    function quickAddToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (product) {
        cart.push({ ...product, selectedColor: product.colors[0] });
        updateCartUI();
      }
    }

    function addDetailToCart(productId) {
      const product = products.find(p => p.id === productId);
      const colorSelect = document.getElementById("modal-color-select");
      if (product && colorSelect) {
        cart.push({ ...product, selectedColor: colorSelect.value });
        updateCartUI();
        closeModal("detail-modal");
      }
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
      if (document.getElementById("checkout-view").classList.contains("active")) {
        renderCheckoutView();
      }
    }

    function updateCartUI() {
      document.getElementById("cart-count").innerText = cart.length;
      const cartItemsContainer = document.getElementById("cart-items");
      const cartTotalContainer = document.getElementById("cart-total");

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 1.5rem;">購物車內暫無裝備</p>`;
        cartTotalContainer.innerText = `NT$ 0`;
        return;
      }

      let total = 0;
      cartItemsContainer.innerHTML = cart.map((item, index) => {
        total += item.price;
        return `
          <div class="cart-item">
            <div>
              <div style="font-weight:600; color:#fff;">${item.name}</div>
              <div class="cart-item-meta">顏色: ${item.selectedColor}</div>
              <div style="color: var(--accent-red); font-weight:bold; font-size:0.9rem;">NT$ ${item.price.toLocaleString()}</div>
            </div>
            <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#ff4757; cursor:pointer; font-size:0.85rem;">移除</button>
          </div>
        `;
      }).join("");

      cartTotalContainer.innerText = `NT$ ${total.toLocaleString()}`;
    }

    // --- 畫面切換 (商店 / 結帳) ---
    function switchView(viewName) {
      document.querySelectorAll(".view-section").forEach(el => el.classList.remove("active"));
      if (viewName === 'checkout') {
        renderCheckoutView();
        document.getElementById("checkout-view").classList.add("active");
      } else {
        document.getElementById("shop-view").classList.add("active");
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToCheckout() {
      if (cart.length === 0) {
        alert("您的購物車是空的！請先挑選商品。");
        return;
      }
      closeModal("cart-modal");
      switchView('checkout');
    }

    function renderCheckoutView() {
      const listContainer = document.getElementById("checkout-items-list");
      let total = 0;

      if (cart.length === 0) {
        listContainer.innerHTML = `<p style="color:var(--text-muted);">無選購商品</p>`;
      } else {
        listContainer.innerHTML = cart.map(item => {
          total += item.price;
          return `
            <div class="summary-row">
              <span>${item.name} <small style="color:var(--text-muted);">(${item.selectedColor})</small></span>
              <span>NT$ ${item.price.toLocaleString()}</span>
            </div>
          `;
        }).join("");
      }

      document.getElementById("checkout-subtotal").innerText = `NT$ ${total.toLocaleString()}`;
      document.getElementById("checkout-final-total").innerText = `NT$ ${total.toLocaleString()}`;
    }

    function handleCheckoutSubmit(event) {
      event.preventDefault();
      alert("🎉 感謝您的購買！此為測試結帳頁面，訂單已成功送出。");
      cart = [];
      updateCartUI();
      switchView('shop');
    }

    // --- Modal 開關函式 ---
    function openModal(modalId) {
      document.getElementById(modalId).classList.add("active");
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove("active");
    }

    function toggleCartModal() {
      const modal = document.getElementById("cart-modal");
      if (modal.classList.contains("active")) {
        closeModal("cart-modal");
      } else {
        openModal("cart-modal");
      }
    }

    // 啟動渲染
    renderProducts();
  </script>
